# SMOKE crawler.yml: download mode (download.enabled: true), short intervals.
cycle_interval_seconds: 5.0
search_poll_budget_seconds: 3.0
search_poll_interval_seconds: 1.0
keyword_pause_min_seconds: 0.1
keyword_pause_max_seconds: 0.5
decision_poll_interval_seconds: 2.0
shutdown_deadline_seconds: 5.0

backoff:
  base_seconds: 1.0
  cap_seconds: 10.0
  factor: 2.0
  jitter_ratio: 0.3

amules:
  - name: amule-smoke
    host: amuled
    port: 4712
    password: smoke-ec-password

search:
  keywords: [keroro, titar]

catalog_db_path: /data/catalog/catalog.db
local_db_path: /data/local/local.db

# webui served in-process by the crawler; 0.0.0.0 so docker exec can reach it.
webui:
  enabled: true
  host: 0.0.0.0
  port: 8080

download:
  enabled: true
  poll_interval_seconds: 3.0
  disk_cap_bytes: 53687091200
  endpoint:
    name: amule-smoke-dl
    host: amuled
    port: 4712
    password: smoke-ec-password
