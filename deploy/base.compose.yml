# Base fragment, included by deploy/compose.yaml and deploy/gluetun.compose.yml.
# Defines everything except amuled and the VPN layer.
# Validate alone (from repo root):
#   AMULE_EC_PASSWORD=x docker compose -f deploy/base.compose.yml config
x-crawler-common: &crawler-common
  image: ghcr.io/geoffreycoulaud/mulewatch-crawler:${IMAGE_TAG:-latest}
  user: "999:999"
  read_only: true
  tmpfs:
    # size= caps tmpfs so a compromised container cannot fill host RAM.
    - /tmp:size=64m
  cap_drop:
    - ALL
  security_opt:
    - "no-new-privileges:true"
  pids_limit: 256
  mem_limit: 512m
  restart: unless-stopped

services:
  crawler:
    <<: *crawler-common
    # Secrets referenced as ${VAR} in crawler.yml are interpolated by the crawler from ITS OWN
    # os.environ (config adapter), so they must be injected here. Explicit mapping (not
    # env_file: .env) for least privilege: the crawler has no business seeing the VPN key.
    # :? makes `compose up` fail early and clearly when a secret is missing.
    environment:
      AMULE_EC_PASSWORD: ${AMULE_EC_PASSWORD:?}
    command:
      - "--config"
      - "/app/config/crawler.yml"
      - "--targets"
      - "/app/config/targets.yml"
      - "--matcher"
      - "/app/config/matcher.yml"
    networks:
      ec:
        aliases: [crawler]
      egress: {}
    # ./downloads is mounted READ-ONLY and no file in it is ever opened: the crawler calls
    # statvfs on it (shutil.disk_usage) to measure free space before admitting a download.
    # incoming/ and temp/ share one filesystem, so the parent covers both in one call.
    volumes:
      - ./config/crawler/crawler.yml:/app/config/crawler.yml:ro
      - ./config/crawler/targets.yml:/app/config/targets.yml:ro
      - ./config/crawler/matcher.yml:/app/config/matcher.yml:ro
      - ./downloads:/data/downloads:ro
      - catalog-db:/data/catalog
      - local-db:/data/local
    # The crawler ALSO serves the read-only webui in-process (same image), on its own thread. The
    # bind is fixed at 0.0.0.0:8080 in-process; `webui.enabled` toggles the whole HTTP surface; the
    # published port + networks control exposure (no built-in auth). This is the crawler
    # container's ONLY inbound port: front it with the operator's reverse proxy / VPN. A webui
    # crash degrades (the crawler keeps crawling), so the healthcheck is a liveness signal for the
    # HTTP surface, not a crawl-health gate.
    ports:
      - "${WEBUI_PORT:-8080}:8080"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - |
          import urllib.request, sys
          r = urllib.request.urlopen("http://localhost:8080/health")
          sys.exit(0 if r.status == 200 else 1)
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  ec: {}
  egress: {}

volumes:
  catalog-db: {}
  local-db: {}
  amule-state: {}
