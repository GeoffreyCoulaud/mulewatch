# VPN stack: mulewatch shares gluetun's network namespace. Two services, no socket proxy.
# Automatic High-ID: VPN_PORT_FORWARDING=on (.env) + port_sync.enabled: true (crawler.yml);
# port-sync now restarts amuled with `s6-svc` inside the container, so no Docker API is involved.
# Run (from deploy/):
#   docker compose -f gluetun.compose.yml up -d
name: mulewatch

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-protonvpn}
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:?}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-}
      VPN_PORT_FORWARDING: ${VPN_PORT_FORWARDING:-off}
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: '{"auth":"none"}'
    # mulewatch has no network of its own here, so its two web surfaces are published on gluetun.
    # 8080 (mulewatch catalog UI) has NO authentication; 4711 (amuleweb) is guarded by WEBUI_PWD.
    # NOT VALIDATED (spec §13): sources disagree on whether gluetun's firewall also needs
    # FIREWALL_INPUT_PORTS=8080,4711 for connections arriving from the LAN. If the ports answer
    # from the host but not from another machine, that variable is the first thing to try.
    # The eD2k port is NOT published: it comes in through the VPN's forwarded port, not the host.
    ports:
      - "${WEBUI_PORT:-8080}:8080"
      - "${AMULEWEB_PORT:-4711}:4711"
    restart: unless-stopped

  mulewatch:
    extends:
      file: base.compose.yml
      service: mulewatch
    # Declared HERE and not in the fragment: `extends:` never shares depends_on,
    # links or volumes_from, and `network_mode: service:` belongs to the stack that
    # owns the network anyway.
    network_mode: "service:gluetun"
    depends_on: [gluetun]
