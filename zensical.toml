[project]
site_name = "mulewatch"
site_url = "https://geoffreycoulaud.github.io/mulewatch/"
site_description = "Surveillance continue du réseau eMule pour retrouver des médias perdus"
docs_dir = "docs"
site_dir = "site"

repo_url = "https://github.com/GeoffreyCoulaud/mulewatch"
repo_name = "GeoffreyCoulaud/mulewatch"

nav = [
  { "Accueil" = "index.md" },
  { "Démarrer" = [
    { "Installer un nœud" = "install.md" },
    { "Faire tourner un nœud" = "operate.md" },
  ] },
  { "Aller plus loin" = [
    { "Passer derrière un VPN" = "vpn.md" },
    { "Devenir High-ID" = "high-id.md" },
    { "Régler le nœud" = "settings.md" },
    { "Migrer un nœud 1.x" = "migration-1x.md" },
    { "Vérifier une image" = "verify-image.md" },
  ] },
  { "Quand ça coince" = [
    { "Le déploiement bloque" = "troubleshooting-start.md" },
    { "Diagnostics avancés" = "troubleshooting.md" },
  ] },
  { "Comprendre" = [
    { "Légalité et vie privée" = "legal.md" },
    { "Glossaire" = "glossary.md" },
    { "Limites connues" = "limits.md" },
  ] },
  { "Contribuer" = [
    { "Architecture du code" = "contributing/architecture.md" },
    { "Lancer les tests" = "contributing/testing.md" },
  ] },
]

[project.theme]
language = "fr"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Basculer en thème clair"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Basculer en thème sombre"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Suivre le réglage du système"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
# Keep accents in heading anchors, so a link works identically on the site and on GitHub.
# The default slugify strips them: "nœud" would become "nud".
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
