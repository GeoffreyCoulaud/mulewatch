# Default stack: no VPN, amuled on a direct network.
# The webui is served in-process by the crawler (port 8080). Every service starts
# unconditionally: there is no compose profile.
# Low-ID by default; High-ID means opening LISTEN_PORT.
# Run (from deploy/):
#   docker compose up -d
name: mulewatch

include:
  - path: base.compose.yml

services:
  amuled:
    image: ngosang/amule:3.0.0-1
    container_name: amuled
    environment:
      GUI_PWD: ${AMULE_EC_PASSWORD:?}
    ports:
      - "${LISTEN_PORT:-4662}:4662"
      - "${LISTEN_PORT:-4662}:4662/udp"
    # The container path /data/quarantine is a legacy name kept on purpose: it is amuled's
    # IncomingDir in amule.conf, inside the amule-state volume. Renaming it would force an edit
    # of that file on every existing deployment, for a cosmetic gain.
    volumes:
      - amule-state:/home/amule/.aMule
      - ./downloads/incoming:/data/quarantine
      - ./downloads/temp:/data/amule-temp
    networks:
      ec:
        aliases: [amuled]
    restart: unless-stopped
