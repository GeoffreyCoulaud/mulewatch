# Default stack: no VPN, amuled on a direct network.
# The webui is served in-process by the crawler (port 8080). Every service starts
# unconditionally: there is no compose profile.
# Low-ID by default; High-ID means opening LISTEN_PORT.
# Run (from deploy/):
#   docker compose up -d
name: mulewatch

include:
  - path: base.compose.yml

services:
  amuled:
    image: ngosang/amule:3.0.0-1
    container_name: amuled
    environment:
      GUI_PWD: ${AMULE_EC_PASSWORD:?}
    ports:
      - "${LISTEN_PORT:-4662}:4662"
      - "${LISTEN_PORT:-4662}:4662/udp"
    # /downloads is where the image puts IncomingDir and TempDir by default, so we bind there and
    # touch no amuled setting. The image writes amule.conf only when absent: overriding the paths
    # would take effect on the first boot alone, and drift from the image on any later change.
    volumes:
      - amule-state:/home/amule/.aMule
      - ./downloads:/downloads
    networks:
      ec:
        aliases: [amuled]
    restart: unless-stopped
