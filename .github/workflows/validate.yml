name: Validate

on:
  workflow_call:
    inputs:
      push:
        description: If true, the build-and-verify job also pushes the image to ghcr by digest.
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/geoffreycoulaud/mulewatch

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-uv-env
      - name: Static checks
        run: uv run poe lint-all

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-uv-env
        with:
          save-cache: 'false'  # lint is the x86 cache writer; test restores only
      - name: Unit tests
        run: uv run poe test

  # One job per arch on its native runner: build the image (loaded locally, and pushed
  # by digest when inputs.push), run the compose smoke stack against the local image, then
  # upload the digest for the release merge. The push exporter runs during the build, but
  # only publish-manifest publishes a tag, and it is downstream of this job's integration
  # step, so no tag ever references an image that failed integration.
  build-and-verify:
    needs: [lint, test]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      # fetch-depth: 0 fetches the full history AND tags: the version step below derives the
      # product version from the pushed git tag, which a shallow checkout would not see. The
      # lint/test jobs stay shallow (their derived version is irrelevant).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-uv-env
        with:
          # One uv-cache writer per runner arch: arm64 (the sole arm64 job) saves; amd64
          # restores lint's x86 cache. Avoids concurrent same-key saves → no cache warning.
          save-cache: ${{ matrix.arch == 'arm64' }}
      # Compute the product version once, the same way a local build would (hatch-vcs over the
      # tag). Injected into the image as the VERSION build-arg -> installed wheel metadata +
      # OCI label. hatch prints "Inspecting build dependencies" to stderr; the version is the
      # sole stdout line. On main/PR (no release tag at HEAD) this is a dev version like
      # 0.19.2.devN+g<sha>; on a vX.Y.Z tag push it is X.Y.Z.
      - name: Compute the product version from the git tag
        id: version
        run: |
          echo "value=$(cd packages/crawler && uvx --quiet --with hatch-vcs hatch version)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to ghcr.io
        if: ${{ inputs.push }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the crawler image (${{ matrix.arch }})
        id: crawler
        uses: ./.github/actions/docker-image
        with:
          package: crawler
          platform: linux/${{ matrix.arch }}
          image: ${{ env.IMAGE }}
          local-tag: ci-${{ github.sha }}
          push: ${{ inputs.push }}
          cache-scope: crawler-${{ matrix.arch }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
      - name: Compose smoke stack integration (${{ matrix.arch }})
        run: ( cd packages/crawler && uv run pytest -m compose_integration --no-cov -q )
        env:
          IMAGE_TAG: ci-${{ github.sha }}
      - name: Export the digest
        if: ${{ inputs.push }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${CRAWLER_DIGEST#sha256:}"
        env:
          CRAWLER_DIGEST: ${{ steps.crawler.outputs.digest }}
      - name: Upload the crawler digest
        if: ${{ inputs.push }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The three EC suites talk to an amuled the CALLER provides (docs/contributing/testing.md 3.0). The
  # runner's Docker can create a veth, so a published-port `docker run` is all it takes.
  ec-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-uv-env
        with:
          save-cache: 'false'  # lint is the x86 cache writer
      - name: Start a throwaway amuled
        run: |
          docker run -d --rm --name amuled \
            -e GUI_PWD=indexer-ec-test -p 4712:4712 ngosang/amule:3.0.0-1
          for _ in $(seq 1 90); do
            # `if`, not `&&`: the step runs under `set -e`, where a bare failing grep aborts it.
            if docker logs amuled 2>&1 | grep -q 'listening on 0.0.0.0:4712'; then exit 0; fi
            sleep 2
          done
          echo "::error::amuled never announced its EC server"
          docker logs amuled
          exit 1
      - name: EC, download and orchestration integration
        run: |
          cd packages/crawler
          uv run pytest -m "ec_integration or download_integration or orchestration_integration" \
            --no-cov -q
        env:
          MULEWATCH_TEST_EC_HOST: 127.0.0.1
          MULEWATCH_TEST_EC_PORT: '4712'
          MULEWATCH_TEST_EC_PASSWORD: indexer-ec-test

  # Single aggregation gate for branch protection: require only `validate / gate` instead of the
  # individual (matrix-suffixed) job checks, stable when jobs/matrix legs change. `if: always()`
  # is essential: GitHub treats a *skipped* required check as passing, so the gate must always run
  # and fail explicitly rather than be skipped when an upstream job fails.
  gate:
    needs: [lint, test, build-and-verify, ec-integration]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: All validation jobs must succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Validation job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "::error::a required validation job reported '$r'"; exit 1; }
          done
          echo "All validation jobs succeeded."
