# Standalone SMOKE stack (compose_integration test). NOT a real deployment: it uses the
# tests/smoke/ configs and named volumes (to exercise the mount permissions), without gluetun
# or docker-proxy. One stack, no profiles.
# Driven by packages/crawler/tests/integration/test_compose_smoke.py.
# Invoked with --project-directory <repo root>: every relative path resolves against the repo
# root (context=., configs ./tests/smoke/*.yml).
services:
  amuled:
    image: ngosang/amule:3.0.0-1
    networks:
      - ec
    environment:
      GUI_PWD: smoke-ec-password
    volumes:
      - amule-state:/home/amule/.aMule
      - downloads:/downloads
    restart: unless-stopped

  crawler:
    image: ghcr.io/geoffreycoulaud/mulewatch-crawler:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: packages/crawler/Dockerfile
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp:size=64m  # sandbox-confinement#3
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    networks:
      ec:
        aliases: [crawler]
      egress: {}
    command:
      - "--config"
      - "/app/config/crawler.yml"
      - "--targets"
      - "/app/config/targets.yml"
      - "--matcher"
      - "/app/config/matcher.yml"
    volumes:
      - ./tests/smoke/crawler.yml:/app/config/crawler.yml:ro
      - ./tests/smoke/targets.yml:/app/config/targets.yml:ro
      - ./deploy/config/crawler/matcher.yml:/app/config/matcher.yml:ro
      # Read-only, for statvfs only (download.output_dir): the same volume amuled writes its
      # finished files to, so the crawler measures the filesystem that actually fills up.
      - downloads:/data/downloads:ro
      - catalog-db:/data/catalog
      - local-db:/data/local
    restart: unless-stopped

networks:
  ec: {}
  egress: {}

volumes:
  catalog-db: {}
  local-db: {}
  amule-state: {}
  downloads: {}
